# Query blocks. queries.py expands the cross product of the blocks into the
# canonical query set (PubMed/Europe PMC get boolean syntax, OpenAlex/Semantic
# Scholar get relevance keyword phrases with wildcards stripped).
#
# Design: every query is region AND ses. The outcome block is ONLY the two
# target structures, so no query can fire without naming hippocampus or
# amygdala. Region-agnostic terms (subcortical volume, pipeline names) and the
# generic method block were removed: crossed against ses they generated
# region-free queries that flooded the corpus with off-topic brain-and-SES
# papers. Volume/MRI wording is recovered at the screening stage and by
# reference mining, not by widening the search.
version: 1

# Which fields to target. PubMed -> [tiab], Europe PMC -> free text with
# wildcard, OpenAlex / Semantic Scholar -> title+abstract relevance search.
field: title_abstract

# Outcome: the two target structures only. REQUIRED in every query.
brain:
  - "hippocamp*"                 # hippocampus, hippocampal
  - "amygdala"

# Exposure: kept wide on purpose (looser recall on the SES side). REQUIRED in
# every query, one term per query, crossed against each region.
ses:
  - "socioeconomic status"
  - "poverty"
  - "income"
  - "income-to-needs"
  - "parental education"
  - "neighborhood disadvantage"
  - "neighborhood deprivation"
  - "material deprivation"
  - "area deprivation index"
  - "social class"
  - "financial hardship"
  - "social benefits"
  - "welfare receipt"

# No method block: queries are region AND ses only. See header.
