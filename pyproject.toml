[project]
name = "ses-meta-search"
version = "0.1.0"
description = "Literature search layer for the SES x subcortical-volume living meta-analysis"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["search/tests", "llm/tests", "screen/tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["search", "search.sources", "llm", "screen", "screen.evals"]
